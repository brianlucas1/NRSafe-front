<p-toast></p-toast>

<div class="grid grid-cols-1 xl:grid-cols-12 gap-6 w-full">
  <div *ngIf="isFuncionarioPerfil && dadosFuncionarioForm" class="card w-full xl:col-span-7">
    <div class="card-header">
      <h2>Dados Cadastrais</h2>
    </div>

    <div class="card-body">
      <form [formGroup]="dadosFuncionarioForm" class="grid gap-4">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
          <div class="flex flex-col gap-1">
            <label class="font-bold">Nome</label>
            <input pInputText formControlName="nome" readonly class="w-full bg-gray-100" />
          </div>

          <div class="flex flex-col gap-1">
            <label class="font-bold">Email</label>
            <input pInputText formControlName="email" readonly class="w-full bg-gray-100" />
          </div>

          <div class="flex flex-col gap-1">
            <label class="font-bold">CPF</label>
            <input pInputText formControlName="cpf" readonly class="w-full bg-gray-100" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
          <div class="flex flex-col gap-1">
            <label class="font-bold">Telefone</label>
            <p-inputmask formControlName="telefone" mask="(99) 9999-9999" styleClass="w-full" />
          </div>

          <div class="flex flex-col gap-1">
            <label class="font-bold">Celular</label>
            <input pInputText formControlName="celular" class="w-full bg-gray-100" />
          </div>

          <div class="flex flex-col gap-1">
            <label class="font-bold">Data de Nascimento</label>
            <input pInputText formControlName="dtNascimento" class="w-full bg-gray-100" />
          </div>
        </div>

        <hr class="my-1">

        <div class="grid gap-4">
          <h2 class="m-0 font-bold text-xl">Endereco</h2>

          <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            <div class="flex flex-col gap-1">
              <label class="font-bold">CEP</label>
              <p-inputmask formControlName="cep" mask="99999-999" styleClass="w-full" (onBlur)="buscaCep()" />
            </div>

            <div class="flex flex-col gap-1">
              <label class="font-bold">Logradouro</label>
              <input pInputText formControlName="logradouro" class="w-full bg-gray-100" />
            </div>

            <div class="flex flex-col gap-1">
              <label class="font-bold">Numero</label>
              <input pInputText formControlName="numero" class="w-full bg-gray-100" />
            </div>

            <div class="flex flex-col gap-1">
              <label class="font-bold">Complemento</label>
              <input pInputText formControlName="complemento" class="w-full bg-gray-100" />
            </div>

            <div class="flex flex-col gap-1">
              <label class="font-bold">Localidade</label>
              <input pInputText formControlName="localidade" class="w-full bg-gray-100" />
            </div>

            <div class="flex flex-col gap-1">
              <label class="font-bold">UF</label>
              <input pInputText formControlName="uf" class="w-full bg-gray-100" />
            </div>

            <div class="flex flex-col gap-1">
              <label class="font-bold">Bairro</label>
              <input pInputText formControlName="bairro" class="w-full bg-gray-100" />
            </div>
          </div>
        </div>

        <div class="flex justify-end pt-2">
          <button pButton label="Salvar" class="p-button-success" (click)="salvarFuncionario()"></button>
        </div>
      </form>
    </div>
  </div>

  <div *ngIf="!isFuncionarioPerfil && dadosClienteForm" class="card w-full xl:col-span-7">
    <div class="card-header">
      <h2>Dados Cadastrais</h2>
    </div>

    <div class="card-body">
      <form [formGroup]="dadosClienteForm" class="grid gap-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="flex flex-col gap-1">
            <label class="font-bold">Razao Social</label>
            <input pInputText formControlName="razaoSocial" readonly class="w-full bg-gray-100" />
          </div>

          <div class="flex flex-col gap-1">
            <label class="font-bold">CNPJ</label>
            <input pInputText formControlName="cnpj" readonly class="w-full bg-gray-100" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="flex flex-col gap-1">
            <label class="font-bold">Email</label>
            <input pInputText formControlName="email" readonly class="w-full bg-gray-100" />
          </div>

          <div class="flex flex-col gap-1">
            <label class="font-bold">Telefone</label>
            <p-inputmask formControlName="telefone" mask="(99) 9999-9999" styleClass="w-full" />
          </div>
        </div>

        <hr class="my-1">

        <div class="grid gap-4">
          <h2 class="m-0 font-bold text-xl">Endereco</h2>

          <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            <div class="flex flex-col gap-1">
              <label class="font-bold">CEP</label>
              <p-inputmask formControlName="cep" mask="99999-999" styleClass="w-full" (onBlur)="buscaCep()" />
            </div>

            <div class="flex flex-col gap-1">
              <label class="font-bold">Logradouro</label>
              <input pInputText formControlName="logradouro" class="w-full bg-gray-100" />
            </div>

            <div class="flex flex-col gap-1">
              <label class="font-bold">Numero</label>
              <input pInputText formControlName="numero" class="w-full bg-gray-100" />
            </div>

            <div class="flex flex-col gap-1">
              <label class="font-bold">Complemento</label>
              <input pInputText formControlName="complemento" class="w-full bg-gray-100" />
            </div>

            <div class="flex flex-col gap-1">
              <label class="font-bold">Localidade</label>
              <input pInputText formControlName="localidade" class="w-full bg-gray-100" />
            </div>

            <div class="flex flex-col gap-1">
              <label class="font-bold">UF</label>
              <input pInputText formControlName="uf" class="w-full bg-gray-100" />
            </div>

            <div class="flex flex-col gap-1">
              <label class="font-bold">Bairro</label>
              <input pInputText formControlName="bairro" class="w-full bg-gray-100" />
            </div>
          </div>
        </div>

        <div class="flex justify-end pt-2">
          <button pButton label="Salvar" class="p-button-success" (click)="salvarCliente()"></button>
        </div>
      </form>
    </div>
  </div>

  <div *ngIf="senhaForm" class="card w-full h-fit xl:col-span-5">
    <div class="card-header">
      <h2>Trocar Senha</h2>
    </div>

    <div class="card-body">
      <form [formGroup]="senhaForm" (ngSubmit)="trocarSenha()" class="grid gap-4">
        <div class="flex flex-col gap-1">
          <label class="font-bold">Senha Atual</label>
          <input pInputText type="password" formControlName="senhaAtual" class="w-full bg-gray-100" />
        </div>

        <div class="flex flex-col gap-1">
          <label class="font-bold">Nova Senha</label>
          <p-password
            id="pass"
            formControlName="novaSenha"
            placeholder="senha"
            [toggleMask]="true"
            [fluid]="true"
            [feedback]="false"
          >
          </p-password>
        </div>

        <div class="flex flex-col gap-1">
          <label class="font-bold">Confirmar Nova Senha</label>
          <p-password
            id="password1"
            formControlName="confirmarSenha"
            placeholder="senha"
            [toggleMask]="true"
            [fluid]="true"
            [feedback]="false"
          >
          </p-password>

          <div *ngIf="senhaForm.errors?.['senhasDiferentes'] && senhaForm.get('confirmarSenha')?.touched">
            <small class="text-red-500">As senhas nao conferem.</small>
          </div>
        </div>

        <div class="flex justify-end pt-2">
          <button pButton label="Atualizar Senha" class="p-button-primary" type="submit"></button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="mt-6">
  <app-troca-plano></app-troca-plano>
</div>
